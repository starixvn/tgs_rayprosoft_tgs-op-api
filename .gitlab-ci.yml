include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/operator-api
  TgsSettingKey: operator-api
  HelmTemplateFolderName: operator-api
  BuildCacheKey: Tgs.Op-Api-EX.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template
  script:
    - npm ci --prefix op_client
    - npm run build --prefix op_client
    - dotnet clean
    - dotnet build -c $BuildConfiguration

unit-test:
  extends: .unit-test-template
  
push-nuget:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  script:
    - dotnet pack -c $BuildConfiguration "Operator.Client/Operator.Client.csproj" --no-restore
    - dotnet nuget push "Operator.Client/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
  artifacts:
    name: Nuget
    untracked: false
    expire_in: "30 days"
    paths:
      - Operator.Client/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true   
    policy: pull
  script:
    - docker build -t "$ImageName:$Tag" --build-arg [BuildConfiguration]=$BuildConfiguration -f "OperatorApi/Dockerfile" . --no-cache
    - docker push $ImageName:$Tag

push-k8s-template:
  extends: .push-k8s-template

deploy-dev:
  extends: .build-k8s-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: dev
  stage: deploy-dev
  tags:
    - dev
    - kubernetes
    - deploy
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace

deploy-staging:
  extends: .build-k8s-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: staging
  stage: deploy-staging
  tags:
    - staging
    - kubernetes
    - deploy
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace

deploy-prod:
  extends: .build-k8s-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: prod
  stage: deploy-prod
  tags:
    - prod
    - kubernetes
    - deploy
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
